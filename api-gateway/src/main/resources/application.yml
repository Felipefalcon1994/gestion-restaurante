server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ==========================================
            # Jorge: Microservicios Fundacionales
            # ==========================================
            - id: menu-productos
              uri: http://localhost:8081
              predicates:
                - Path=/api/productos/**

            - id: menu-categorias
              uri: http://localhost:8081
              predicates:
                - Path=/api/categorias/**

            - id: usuarios-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/usuarios/**, /api/roles/**

            # ==========================================
            # Feña: Microservicios Operativos
            # ==========================================
            - id: inventario-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/insumos/**, /api/recetas/**

            - id: cocina-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/cocina/**

            # ==========================================
            # FELIPE: Microservicios Transaccionales
            # ==========================================
            - id: pedidos-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/pedidos/**

            - id: pagos-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/pagos/**


                