spring.application.name=pedidos

spring.datasource.url=jdbc:mysql://localhost:3306/db_pedidos?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

server.port=8084

# URLs de otros microservicios
menu-service.url=http://localhost:8081/api/productos
usuarios-service.url=http://localhost:8083/api/usuarios
